# Release workflow template. Replace every PLACEHOLDER from the project's
# build documents, keep one build job per ready target, and remove these
# comments' instructions. Candidate tags (v1.0-candidate.1) do not match.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag is the project version, on the release branch, with notes
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(PLACEHOLDER: a command that prints the project's version)"
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match the project version $version." >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME is not on main." >&2
            exit 1
          fi
          if [ ! -s "release-notes/$GITHUB_REF_NAME.md" ]; then
            echo "release-notes/$GITHUB_REF_NAME.md is missing." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One job per ready target. The packaging script runs the tests and writes
  # its artifacts into dist/, the same way a developer runs it.
  build-PLACEHOLDER-target:
    needs: check
    runs-on: PLACEHOLDER: runner, such as ubuntu-24.04
    # Omit `container` when the runner itself is the target's base system.
    container: PLACEHOLDER: image of the oldest supported system
    steps:
      - uses: actions/checkout@v4

      - name: Package
        run: PLACEHOLDER: the target's packaging script

      - uses: actions/upload-artifact@v4
        with:
          name: PLACEHOLDER-target
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [check, build-PLACEHOLDER-target]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          name: PLACEHOLDER-product ${{ needs.check.outputs.version }}
          body_path: release-notes/${{ github.ref_name }}.md
          files: dist/*
          fail_on_unmatched_files: true
